<div v-if="rankSoftList.length" class="DoubleRowList">
  <header>
    <span class="title">{{ rankData.name }}</span>
    <span class="more" tabindex="0" role="button" @click="toList" @keydown.enter.prevent.stop="toList" @keydown.space.prevent.stop="toList">更多</span>
  </header>
  <section>
    <div
      v-for="item of rankSoftList"
      :key="item.softId"
      tabindex="0"
      role="button"
      :aria-label="item.softName + '，点击查看详情'"
      @click="toDetail(item)"
      @keydown.enter.prevent.stop="toDetail(item)"
      @keydown.space.prevent.stop="toDetail(item)">
      <b aria-hidden="true">
        <i :style="{ backgroundImage: `url('${item.showInfo.himg || defaultImg}')` }">
          <img
            v-if="!item.showInfo.himg && item.showInfo.logoFile"
            :src="item.showInfo.logoFile" alt="">
        </i>
      </b>
      <span v-if="item.currentTimeActivity" class="limit">{{ item.currentTimeActivity.endTime | timeLeft(serverCurrentTime) }}</span>
      <span v-else-if="item.showInfo.ruleLabelName" :class="item.showInfo.ruleLabelClassName">{{ item.showInfo.ruleLabelName }}</span>
      <h1>{{ item.softName }}</h1>
      <p class="cdk" v-if="item.softPurpose === 1">
        <span v-if="item.productInfo.discount" class="discount">{{ item.productInfo.discount }}</span>
        <span class="currentPrice">¥{{ item.productInfo.currentPrice }}</span>
        <span v-if="item.productInfo.discount && item.productInfo.originalPrice" class="originalPrice">¥{{ item.productInfo.originalPrice }}</span>
        <span v-if="item.productInfo.exchangePlatformFont" class="iconfont platform" v-html="item.productInfo.exchangePlatformFont"></span>
      </p>
      <p class="download" v-else>免费开玩<i>|</i>{{ item.downloadInfo.downloadCount }}</p>
    </div>
  </section>
</div>
